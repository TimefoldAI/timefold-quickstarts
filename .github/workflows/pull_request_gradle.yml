name: Gradle

on:
  push:
    branches: [stable, development, '*.x']
    paths:
      - 'settings.gradle'
      - 'use-cases/**/*'
      - 'getting-started/**/*'
      - '.github/**/*.yml'
  pull_request:
    branches: [stable, development, '*.x']
    paths:
      - 'settings.gradle'
      - 'use-cases/**/*'
      - 'getting-started/**/*'
      - '.github/**/*.yml'

jobs:
  build:
    concurrency:
      group: pull_request_gradle-${{ github.event_name }}-${{ github.head_ref }}-${{ matrix.module }}-${{ matrix.java-version }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # A broken JDK must not cancel the others.
      matrix:
        module: ['getting-started/hello-world', 'use-cases/school-timetabling', 'getting-started/spring-boot-integration']
        # Compile target, current LTS and latest JDK; replace 27 on each JDK release.
        java-version: [ 21, 25, 27 ]
    timeout-minutes: 120
    steps:
      - name: Checkout timefold-quickstarts
        uses: actions/checkout@v7
        with:
          path: './timefold-quickstarts'

      - name: Checkout timefold-solver (PR) # Checkout the PR branch first, if it exists
        if: github.head_ref # Only true if this is a PR.
        id: checkout-solver-pr
        uses: actions/checkout@v7
        continue-on-error: true
        with:
          repository: ${{ github.actor }}/timefold-solver
          ref: ${{ github.head_ref }}
          path: ./timefold-solver
          fetch-depth: 0 # Otherwise merge will fail on account of not having history.
      - name: Checkout timefold-solver (main) # Checkout the main branch if the PR branch does not exist
        if: ${{ steps.checkout-solver-pr.outcome != 'success' }}
        uses: actions/checkout@v7
        with:
          repository: TimefoldAI/timefold-solver
          ref: main
          path: ./timefold-solver
          fetch-depth: 0 # Otherwise merge will fail on account of not having history.

      # Build the solver
      - name: "Setup Java and Gradle"
        uses: actions/setup-java@v6
        with:
          java-version: ${{matrix.java-version}}
          distribution: 'temurin'
          cache: 'gradle'
      - name: Quickly build timefold-solver
        working-directory: ./timefold-solver
        run: mvn -B -Dquickly clean install

      - name: Build and test timefold-quickstarts
        working-directory: ./timefold-quickstarts/${{ matrix.module }}
        run: gradle build
