name: Release
on:
  workflow_dispatch:
    inputs:
      javaVersion:
        description: 'Timefold Solver version (e.g. 2.0.0)'
        required: true
      stableBranch:
        description: 'Stable branch to merge the development branch into'
        default: stable
        required: true
jobs:
  build:
    env:
      MAVEN_ARGS: "--no-transfer-progress --batch-mode"
    runs-on: self-hosted
    steps:
      - name: Resolve the release branch name
        shell: bash
        env:
          VERSION: ${{ github.event.inputs.javaVersion }}
        run: |
          if [[ ! "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Unsupported version format '$VERSION'. Expected semver-like major.minor.patch." >&2
            exit 1
          fi
          release_branch="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.x"
          echo "RELEASE_BRANCH_NAME=$release_branch" >> "$GITHUB_ENV"

      - name: Checkout timefold-quickstarts
        uses: actions/checkout@v7
        with:
          repository: TimefoldAI/timefold-quickstarts
          path: ./timefold-quickstarts
          ref: ${{ env.RELEASE_BRANCH_NAME }}
          fetch-depth: 0 # Otherwise merge will fail on account of not having history.

      - name: Checkout timefold-solver
        uses: actions/checkout@v7
        with:
          repository: TimefoldAI/timefold-solver
          path: ./timefold-solver
          fetch-depth: 0
          ref: v${{ github.event.inputs.javaVersion }}

      - uses: actions/setup-java@v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Maven
        uses: stCarolas/setup-maven@d6af6abeda15e98926a57b5aa970a96bb37f97d1 # v5
        with:
          maven-version: 3.9.11

      - name: Update version
        working-directory: ./timefold-quickstarts
        env:
          NEW_JAVA_VERSION: ${{ github.event.inputs.javaVersion }}
        run: |
          git config user.name "Timefold Release Bot"
          git config user.email "release@timefold.ai"
          export OLD_JAVA_VERSION="$(find . -name pom.xml -exec grep '<version.ai.timefold.solver>' {} \;|tail -n 1|cut -d\> -f1 --complement|cut -d\< -f1)"
          .github/scripts/change_versions.sh

      # This step will fail if the Solver binaries aren't already on Maven Central.
      - name: Create a tag and build release
        working-directory: ./timefold-quickstarts
        env:
          JAVA_VERSION: ${{ github.event.inputs.javaVersion }}
        run: |
          mvn verify
          git commit -am "build: switch to version $JAVA_VERSION"
          git tag -a "v$JAVA_VERSION" -m "Release version $JAVA_VERSION"
          git push --tags

      # Merge the release branch into the stable branch.
      # While merging, resolve conflicts by using everything from the release branch.
      # (Stable branch becomes the same as the release branch.)
      - name: Merge release branch into stable and prepare PR
        working-directory: ./timefold-quickstarts
        env:
          GITHUB_TOKEN: ${{ secrets.JRELEASER_GITHUB_TOKEN }}
          STABLE_BRANCH: ${{ github.event.inputs.stableBranch }}
          JAVA_VERSION: ${{ github.event.inputs.javaVersion }}
        run: |
          git checkout $STABLE_BRANCH
          git checkout -B $RELEASE_BRANCH_NAME-bump
          git checkout $RELEASE_BRANCH_NAME
          git merge -s ours --no-edit $STABLE_BRANCH
          git checkout $RELEASE_BRANCH_NAME-bump
          git merge --squash $RELEASE_BRANCH_NAME
          git commit -m "build: release version $JAVA_VERSION"
          git push origin $RELEASE_BRANCH_NAME-bump
          gh pr create --reviewer triceo --base $STABLE_BRANCH --head $RELEASE_BRANCH_NAME-bump --title "build: release version $JAVA_VERSION" --body-file .github/workflows/release-pr-body.md

      - name: Put back the 999-SNAPSHOT version on the release branch
        working-directory: ./timefold-quickstarts
        run: |
          git checkout $RELEASE_BRANCH_NAME
          export OLD_JAVA_VERSION="$(find . -name pom.xml -exec grep '<version.ai.timefold.solver>' {} \;|tail -n 1|cut -d\> -f1 --complement|cut -d\< -f1)"
          export NEW_JAVA_VERSION="999-SNAPSHOT"
          .github/scripts/change_versions.sh
          git commit -am "build: move back to version $NEW_JAVA_VERSION"
          git push origin $RELEASE_BRANCH_NAME
