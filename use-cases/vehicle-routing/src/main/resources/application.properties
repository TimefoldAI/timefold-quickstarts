########################
# Timefold Solver properties
########################

# The solver runs for 30 seconds. To run for 5 minutes use "PT5M" and for 2 hours use "PT2H".
timefold.model.termination.spent-limit=PT30S

# Temporary comment this out to detect bugs in your code (lowers performance)
# quarkus.timefold.solver.environment-mode=FULL_ASSERT

# Temporary comment this out to return a feasible solution as soon as possible
# quarkus.timefold.solver.termination.best-score-limit=0hard/*medium/*soft

# To see what Timefold is doing, turn on DEBUG or TRACE logging.
quarkus.log.category."ai.timefold.solver".level=INFO
# For TRACE logging also activate this:
# quarkus.log.min-level=TRACE
%test.quarkus.log.category."ai.timefold.solver".level=INFO
%prod.quarkus.log.category."ai.timefold.solver".level=INFO

########################
# Model information
########################

timefold.model.id=vehicle-routing
quarkus.application.name=${timefold.model.id}
timefold.model.name=Vehicle Routing
model.api.version=v1
timefold.model.api-version=${model.api.version}

timefold.model.contact.email=example@acme.com
timefold.model.contact.name=A.C.M.E.
timefold.model.contact.url=https://acme.com
timefold.model.maturity-level=Example

timefold.model.features[0]=Never load a vehicle beyond the capacity it has for the demand of its visits.
timefold.model.features[1]=Never finish servicing a visit after the end of the time window it accepts a vehicle in.
timefold.model.features[2]=Assign as many visits as possible to a vehicle, leaving only those that do not fit anywhere.
timefold.model.features[3]=Minimize the total driving time of the whole fleet, including the drive back home.
timefold.model.features[4]=Order the visits of each vehicle into a route, so a vehicle waits when it arrives before a visit is ready.

########################
# Model settings
########################

timefold.model.max-thread-count=16
timefold.model.default-config.max-thread-count=1

########################
# Enterprise Edition properties
########################

# Nearby selection makes a big difference on a routing model, but it is a Timefold Solver
# Enterprise Edition feature, so it is only auto-configured under the enterprise profile.
# The move thread count is governed by timefold.model.max-thread-count above.
%enterprise.quarkus.timefold.solver.nearby-distance-meter-class=org.acme.vehiclerouting.domain.LocationDistanceMeter

########################
# Native build properties
########################

# Enable Swagger UI also in the native mode
quarkus.swagger-ui.always-include=true

########################
# Test overrides
########################

# Unlike the other quickstarts, the production PT30S spent limit is deliberately kept in the test
# profile as well, instead of raising it to PT1H and letting the best-score-limit end every run.
# This model has a real medium level (visits left unassigned), and whether "0hard/0medium/*soft" is
# reachable at all depends on the dataset: it is on the small one TestHelper.createProblem() builds,
# and on the demo datasets as they stand today, but a fleet whose capacity or time windows cannot
# absorb every visit has no such score, and a run would then keep going for the full hour. The
# spent limit is the backstop that ends those.
%test.timefold.model.termination.spent-limit=PT30S
%test.timefold.model.termination.best-score-limit=0hard/0medium/*soft
%test.quarkus.timefold.solver.termination.best-score-limit=0hard/0medium/*soft
