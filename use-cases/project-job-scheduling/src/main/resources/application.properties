########################
# Timefold Solver properties
########################

# The solver runs for 30 seconds. To run for 5 minutes use "PT5M" and for 2 hours use "PT2H".
timefold.model.termination.spent-limit=PT30S

# Temporary comment this out to detect bugs in your code (lowers performance)
# quarkus.timefold.solver.environment-mode=FULL_ASSERT

# Temporary comment this out to return a feasible solution as soon as possible
# timefold.model.termination.best-score-limit=0hard/*medium/*soft

# To see what Timefold is doing, turn on DEBUG or TRACE logging.
quarkus.log.category."ai.timefold.solver".level=INFO
# For TRACE logging also activate this:
# quarkus.log.min-level=TRACE
%test.quarkus.log.category."ai.timefold.solver".level=INFO
%prod.quarkus.log.category."ai.timefold.solver".level=INFO

########################
# Model information
########################

timefold.model.id=project-job-scheduling
quarkus.application.name=${timefold.model.id}
timefold.model.name=Project Job Scheduling
model.api.version=v1
timefold.model.api-version=${model.api.version}

timefold.model.contact.email=example@acme.com
timefold.model.contact.name=A.C.M.E.
timefold.model.contact.url=https://acme.com
timefold.model.maturity-level=Template
timefold.model.description=Schedule project jobs by picking an execution mode and start time for each, respecting dependencies and resource capacities to finish projects early.

timefold.model.features[0]=Pick one execution mode per job, trading a shorter duration off against the resources it consumes.
timefold.model.features[1]=Delay a job only as far as needed, and never start it before its project is released or before every job it depends on has finished.
timefold.model.features[2]=Keep the total use of each non-renewable resource within its capacity, and the daily use of each renewable resource within its capacity.
timefold.model.features[3]=Finish every project as close to its critical path as possible, and keep the overall schedule short.

########################
# Model settings
########################

timefold.model.max-thread-count=16
timefold.model.default-config.max-thread-count=1

########################
# Native build properties
########################

# Enable Swagger UI also in the native mode
quarkus.swagger-ui.always-include=true

########################
# Test overrides
########################

# Stop as soon as no resource is overbooked, which is what the tests assert. The medium level carries the
# total project delay, which is not guaranteed to reach zero for every dataset, so the medium score is left
# unbounded instead of using the Service module's 0hard/0medium/*soft default. Both keys are set: the
# Service module runs read the timefold.model one, SolverManager-based tests the quarkus.timefold.solver one.
# The Service module's test spent limits stay in place as a backstop.
%test.timefold.model.termination.best-score-limit=0hard/*medium/*soft
%test.quarkus.timefold.solver.termination.best-score-limit=0hard/*medium/*soft
