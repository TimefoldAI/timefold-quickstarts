########################
# Timefold Solver properties
########################

# The solver runs for 30 seconds. To run for 5 minutes use "PT5M" and for 2 hours use "PT2H".
ai.timefold.platform.termination.spent-limit=PT30S

# Temporary comment this out to detect bugs in your code (lowers performance)
# quarkus.timefold.solver.environment-mode=FULL_ASSERT

# Temporary comment this out to return a feasible solution as soon as possible
# quarkus.timefold.solver.termination.best-score-limit=0hard/*medium/*soft

# To see what Timefold is doing, turn on DEBUG or TRACE logging.
quarkus.log.category."ai.timefold.solver".level=INFO
# For TRACE logging also activate this:
# quarkus.log.min-level=TRACE
%test.quarkus.log.category."ai.timefold.solver".level=INFO
%prod.quarkus.log.category."ai.timefold.solver".level=INFO

########################
# Model information
########################

timefold.application.id=conference-scheduling
quarkus.application.name=${timefold.application.id}
timefold.application.name=Conference Scheduling
model.api.version=v1
timefold.application.version=${model.api.version}

timefold.application.contact.email=example@acme.com
timefold.application.contact.name=A.C.M.E.
timefold.application.contact.url=https://acme.com
timefold.model.maturity-level=Example

timefold.model.features[0]=Respect room and speaker availability so no talk is scheduled when its room or one of its speakers is unavailable.
timefold.model.features[1]=Avoid room and speaker conflicts so a room is never double-booked and a speaker never gives two overlapping talks.
timefold.model.features[2]=Schedule a talk only after all of its prerequisite talks have finished and give speakers a minimum pause between consecutive talks.
timefold.model.features[3]=Keep talks sharing a mutually-exclusive tag from overlapping, and pair each crowd-control talk with exactly one other in its timeslot.
timefold.model.features[4]=Honor required and prohibited timeslot tags of both the talk and its speakers.
timefold.model.features[5]=Honor required and prohibited room tags of both the talk and its speakers.
timefold.model.features[6]=Spread overlapping talks across theme tracks, sectors and content so related talks do not clash.
timefold.model.features[7]=Diversify each timeslot by rewarding mixes of audience types, audience levels and languages.
timefold.model.features[8]=Keep a rising audience-level flow so introductory talks on shared content come before advanced ones.
timefold.model.features[9]=Keep related talks together: same theme track in the same room per day, and shared content or themes on the same day.
timefold.model.features[10]=Match popular talks to larger rooms so a more popular talk is not placed in a smaller room than a less popular one.
timefold.model.features[11]=Favor preferred and avoid undesired timeslot tags of both the talk and its speakers.
timefold.model.features[12]=Favor preferred and avoid undesired room tags of both the talk and its speakers.
timefold.model.features[13]=Pack each speaker's talks into as few days as possible.

########################
# Model settings
########################

ai.timefold.model.max-thread-count=16
ai.timefold.model.default-config.max-thread-count=1

########################
# Native build properties
########################

# Enable Swagger UI also in the native mode
quarkus.swagger-ui.always-include=true

########################
# Test overrides
########################

# Effectively disable spent-time termination in favor of the best-score-limit
%test.ai.timefold.platform.termination.spent-limit=PT1H
%test.quarkus.timefold.solver.termination.best-score-limit=0hard/*medium/*soft
