########################
# Timefold Solver properties
########################

# The solver runs for 30 seconds. To run for 5 minutes use "PT5M" and for 2 hours use "PT2H".
timefold.model.termination.spent-limit=PT30S

# Temporary comment this out to detect bugs in your code (lowers performance)
# quarkus.timefold.solver.environment-mode=FULL_ASSERT

# To see what Timefold is doing, turn on DEBUG or TRACE logging.
quarkus.log.category."ai.timefold.solver".level=INFO
# For TRACE logging also activate this:
# quarkus.log.min-level=TRACE
%test.quarkus.log.category."ai.timefold.solver".level=INFO
%prod.quarkus.log.category."ai.timefold.solver".level=INFO

########################
# Model information
########################

timefold.model.id=employee-scheduling
quarkus.application.name=${timefold.model.id}
timefold.model.name=Employee Scheduling
model.api.version=v1
timefold.model.api-version=${model.api.version}

timefold.model.contact.email=example@acme.com
timefold.model.contact.name=A.C.M.E.
timefold.model.contact.url=https://acme.com
timefold.model.maturity-level=Template
timefold.model.description=Assign employees to shifts, so every shift is covered by an employee with the required skill who is available and rested, while respecting their preferred days and spreading the shifts fairly.

timefold.model.features[0]=Only assign an employee to a shift that needs a skill they have.
timefold.model.features[1]=Never give an employee overlapping shifts, more than one shift a day, or less than 10 hours of rest between two shifts.
timefold.model.features[2]=Never schedule an employee on a day they are unavailable.
timefold.model.features[3]=Avoid the days an employee would rather not work and favor the days they want to work.
timefold.model.features[4]=Spread the shifts fairly across all employees.

########################
# Model settings
########################

timefold.model.max-thread-count=16
timefold.model.default-config.max-thread-count=1

########################
# Native build properties
########################

# Enable Swagger UI also in the native mode
quarkus.swagger-ui.always-include=true

########################
# Test overrides
########################

# The Service module's test profile ends a run after 10 seconds or 1 second without improvement, or at the
# best-score-limit 0hard/0medium/*soft. That limit doesn't parse for this model: HardSoftBigDecimalScore has two
# levels and no wildcard (*) support, as there is no minimum BigDecimal. So clear both best-score-limits.
%test.timefold.model.termination.best-score-limit=
%test.quarkus.timefold.solver.termination.best-score-limit=
