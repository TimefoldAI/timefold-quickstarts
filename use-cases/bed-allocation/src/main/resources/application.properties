########################
# Timefold Solver properties
########################

# The solver runs for 30 seconds. To run for 5 minutes use "PT5M" and for 2 hours use "PT2H".
ai.timefold.platform.termination.spent-limit=PT30S

# Temporary comment this out to detect bugs in your code (lowers performance)
# quarkus.timefold.solver.environment-mode=FULL_ASSERT

# Temporary comment this out to return a feasible solution as soon as possible
# quarkus.timefold.solver.termination.best-score-limit=0hard/0medium/*soft

# To see what Timefold is doing, turn on DEBUG or TRACE logging.
quarkus.log.category."ai.timefold.solver".level=INFO
# For TRACE logging also activate this:
# quarkus.log.min-level=TRACE
%test.quarkus.log.category."ai.timefold.solver".level=INFO
%prod.quarkus.log.category."ai.timefold.solver".level=INFO

########################
# Model information
########################

timefold.application.id=bed-allocation
quarkus.application.name=${timefold.application.id}
timefold.application.name=Bed Allocation
model.api.version=v1
timefold.application.version=${model.api.version}

timefold.application.contact.email=example@acme.com
timefold.application.contact.name=A.C.M.E.
timefold.application.contact.url=https://acme.com
timefold.model.maturity-level=Example

timefold.model.features[0]=Never double-book a bed: two patient stays cannot occupy the same bed on the same night.
timefold.model.features[1]=Respect a room's gender restriction (male-only, female-only or same-gender-per-night).
timefold.model.features[2]=Respect each department's minimum and maximum patient age.
timefold.model.features[3]=Only place a patient in a room that has all of their required medical equipment.
timefold.model.features[4]=Try to assign every patient stay to a bed.
timefold.model.features[5]=Favor rooms within the patient's preferred maximum capacity.
timefold.model.features[6]=Favor a room whose department specialty matches the stay's specialty, preferring the department's first-priority specialty.
timefold.model.features[7]=Favor rooms that have the patient's preferred (non-required) medical equipment.

########################
# Model settings
########################

ai.timefold.model.max-thread-count=16
ai.timefold.model.default-config.max-thread-count=1

########################
# Native build properties
########################

# Enable Swagger UI also in the native mode
quarkus.swagger-ui.always-include=true

########################
# Test overrides
########################

# Effectively disable spent-time termination in favor of the best-score-limit
%test.ai.timefold.platform.termination.spent-limit=PT1H
%test.quarkus.timefold.solver.termination.best-score-limit=0hard/0medium/*soft
