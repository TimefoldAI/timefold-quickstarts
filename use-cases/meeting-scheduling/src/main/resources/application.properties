########################
# Timefold Solver properties
########################

# The solver runs for 30 seconds. To run for 5 minutes use "PT5M" and for 2 hours use "PT2H".
timefold.model.termination.spent-limit=PT30S

# Temporary comment this out to detect bugs in your code (lowers performance)
# quarkus.timefold.solver.environment-mode=FULL_ASSERT

# Temporary comment this out to return a feasible solution as soon as possible
# quarkus.timefold.solver.termination.best-score-limit=0hard/0medium/*soft

# To see what Timefold is doing, turn on DEBUG or TRACE logging.
quarkus.log.category."ai.timefold.solver".level=INFO
# For TRACE logging also activate this:
# quarkus.log.min-level=TRACE
%test.quarkus.log.category."ai.timefold.solver".level=INFO
%prod.quarkus.log.category."ai.timefold.solver".level=INFO

########################
# Model information
########################

timefold.model.id=meeting-scheduling
quarkus.application.name=${timefold.model.id}
timefold.model.name=Meeting Scheduling
model.api.version=v1
timefold.model.api-version=${model.api.version}

timefold.model.contact.email=example@acme.com
timefold.model.contact.name=A.C.M.E.
timefold.model.contact.url=https://acme.com
timefold.model.maturity-level=Example

timefold.model.features[0]=Never double-book a room: two meetings in the same room may not overlap in time.
timefold.model.features[1]=Keep every meeting inside the submitted office hours, starting and ending on the same day.
timefold.model.features[2]=Never ask a required attendee to be in two overlapping meetings at once.
timefold.model.features[3]=Only use a room that is large enough for everyone attending the meeting.
timefold.model.features[4]=Avoid overlapping meetings for someone who is required in one of them and preferred in the other.
timefold.model.features[5]=Avoid overlapping meetings for someone who is a preferred attendee of both.
timefold.model.features[6]=Schedule meetings as early in the horizon as possible.
timefold.model.features[7]=Leave at least one free time slot of breathing room between two back-to-back meetings.
timefold.model.features[8]=Spread meetings out in time so that fewer of them run in parallel.
timefold.model.features[9]=Use the larger rooms first, so meetings are not squeezed into the smallest room available.
timefold.model.features[10]=Keep an attendee's consecutive meetings in the same room, so they do not have to move.

########################
# Model settings
########################

timefold.model.max-thread-count=16
timefold.model.default-config.max-thread-count=1

########################
# Native build properties
########################

# Enable Swagger UI also in the native mode
quarkus.swagger-ui.always-include=true

########################
# Test overrides
########################

# Effectively disable spent-time termination in favor of the best-score-limit
%test.timefold.model.termination.spent-limit=PT1H
%test.quarkus.timefold.solver.termination.best-score-limit=0hard/0medium/*soft
