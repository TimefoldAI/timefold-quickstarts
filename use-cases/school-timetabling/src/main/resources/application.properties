########################
# Timefold Solver properties
########################

# The solver runs for 30 seconds. To run for 5 minutes use "PT5M" and for 2 hours use "PT2H".
timefold.model.termination.spent-limit=PT30S

# Temporary comment this out to detect bugs in your code (lowers performance)
# quarkus.timefold.solver.environment-mode=FULL_ASSERT

# Temporary comment this out to return a feasible solution as soon as possible
# timefold.model.termination.best-score-limit=0hard/*soft

# To see what Timefold is doing, turn on DEBUG or TRACE logging.
quarkus.log.category."ai.timefold.solver".level=INFO
# For TRACE logging also activate this:
# quarkus.log.min-level=TRACE
%test.quarkus.log.category."ai.timefold.solver".level=INFO
%prod.quarkus.log.category."ai.timefold.solver".level=INFO

########################
# Model information
########################

timefold.model.id=school-timetabling
quarkus.application.name=${timefold.model.id}
timefold.model.name=School Timetabling
model.api.version=v1
timefold.model.api-version=${model.api.version}

timefold.model.contact.email=example@acme.com
timefold.model.contact.name=A.C.M.E.
timefold.model.contact.url=https://acme.com
timefold.model.maturity-level=Template
timefold.model.description=Assign lessons to timeslots and rooms, so no room, teacher or student group is double-booked, while keeping teachers in one room with compact days and varying each student group's subjects.

timefold.model.features[0]=Never double-book a room, a teacher or a student group: each can only take one lesson per timeslot.
timefold.model.features[1]=Keep each teacher in the same room for all of their lessons.
timefold.model.features[2]=Give teachers consecutive lessons on the same day, so their schedule has as few gaps as possible.
timefold.model.features[3]=Avoid giving a student group the same subject in back-to-back timeslots.

########################
# Model settings
########################

timefold.model.max-thread-count=16
timefold.model.default-config.max-thread-count=1

########################
# Native build properties
########################

# Enable Swagger UI also in the native mode
quarkus.swagger-ui.always-include=true

########################
# Test overrides
########################

# Effectively disable spent-time termination in favor of the best-score-limit.
# This model scores with HardSoftScore, so both best-score-limits have to be overridden: the Service module
# defaults them to the three-level 0hard/0medium/*soft, which HardSoftScore cannot parse.
%test.timefold.model.termination.spent-limit=PT1H
%test.timefold.model.termination.best-score-limit=0hard/*soft
%test.quarkus.timefold.solver.termination.best-score-limit=0hard/*soft
