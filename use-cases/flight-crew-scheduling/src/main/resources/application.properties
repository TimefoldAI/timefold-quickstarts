########################
# Timefold Solver properties
########################

# The solver runs for 30 seconds. To run for 5 minutes use "PT5M" and for 2 hours use "PT2H".
ai.timefold.orbit.termination.spent-limit=PT30S

# Temporary comment this out to detect bugs in your code (lowers performance)
# quarkus.timefold.solver.environment-mode=FULL_ASSERT

# Temporary comment this out to return a feasible solution as soon as possible
# quarkus.timefold.solver.termination.best-score-limit=0hard/*medium/*soft

# To see what Timefold is doing, turn on DEBUG or TRACE logging.
quarkus.log.category."ai.timefold.solver".level=INFO
# For TRACE logging also activate this:
# quarkus.log.min-level=TRACE
%test.quarkus.log.category."ai.timefold.solver".level=INFO
%prod.quarkus.log.category."ai.timefold.solver".level=INFO

########################
# Model information
########################

timefold.application.id=flight-crew-scheduling
quarkus.application.name=${timefold.application.id}
timefold.application.name=Flight Crew Scheduling
model.api.version=v1
timefold.application.version=${model.api.version}
timefold.model.maturity-level=Example
timefold.application.contact.email=info@example.com
timefold.application.contact.name=Your Name
timefold.application.contact.url=https://example.com

timefold.model.features[0]=Assign each flight only to crew members who hold the skills it requires.
timefold.model.features[1]=Prevent an employee from being assigned to two overlapping flights at the same time.
timefold.model.features[2]=Keep an employee's consecutive flights connected so each one departs from the airport the previous one arrived at.
timefold.model.features[3]=Avoid assigning an employee to a flight on a day they are unavailable.
timefold.model.features[4]=Prefer that each employee's first flight of the schedule departs from their home airport.
timefold.model.features[5]=Prefer that each employee's last flight of the schedule arrives back at their home airport.

########################
# Model settings
########################

ai.timefold.model.max-thread-count=16
ai.timefold.model.default-config.max-thread-count=1
# The solver runs for at most 30 seconds per dataset before returning the best solution found.
ai.timefold.model.default-config.termination.spent-limit=PT30S

########################
# Native build properties
########################

# Enable Swagger UI also in the native mode
quarkus.swagger-ui.always-include=true

########################
# Test overrides
########################

# Effectively disable spent-time termination in favor of the best-score-limit
%test.ai.timefold.orbit.termination.spent-limit=PT1H
%test.quarkus.timefold.solver.termination.best-score-limit=0hard/*medium/*soft
