<html lang="en">
<head>
    <meta content="text/html; charset=UTF-8" http-equiv="Content-Type">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Flight Crew Scheduling - Timefold Solver on Quarkus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="shared/timefold-quickstart.css">
    <link rel="icon" href="https://timefold.ai/uploads/images/Brand-Assets/timefold-solver-logomark.png" type="image/png">

</head>
<body>
<header id="appHeader" class="bg-white shadow">
    <div class="container-fluid">
        <nav class="navbar navbar-expand-lg mb-3">
            <a class="navbar-brand" style="width: 200px;overflow: hidden;">
                <img src="https://timefold.ai/uploads/images/Brand-Assets/timefold-solver-logo.png" alt="Timefold Solver logo" width="200px" style="margin-top:-20px;margin-bottom:-20px">
            </a>
            <a class="navbar-brand d-none d-lg-block">Flight Crew Scheduling</a>
            <div class="ms-auto">
                <div id="solveControls" class="d-flex align-items-center gap-2">
                    <div class="text-end lh-sm">
                        <div id="score" class="score">Score: ?</div>
                        <div id="info" class="input-metric"></div>
                    </div>
                    <button id="analyzeButton" type="button" class="btn btn-secondary btn-icon-circle" title="Score analysis">
                        <span class="fas fa-magnifying-glass-chart"></span>
                    </button>
                    <div class="vr"></div>
                    <button id="solveButton" type="button" class="btn btn-success">
                        <span class="fas fa-play"></span> Solve
                    </button>
                    <button id="stopSolvingButton" type="button" class="btn btn-danger" style="display: none">
                        <span class="fas fa-stop"></span> Stop
                    </button>
                    <div class="vr" id="dataDropdownDivider"></div>
                    <div id="dataDropdown" class="dropdown">
                        <button class="btn btn-secondary dropdown-toggle" type="button" id="dropdownMenuButton"
                                data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                            Data
                        </button>
                        <div id="testDataButton" class="dropdown-menu dropdown-menu-end" aria-labelledby="dropdownMenuButton"></div>
                    </div>
                    <div class="vr" id="dataDropdownDividerAfter"></div>
                    <button id="toggleSummaryButton" type="button" class="btn btn-secondary btn-icon-circle" title="Solution details" style="display: none">
                        <i class="fas fa-chart-bar"></i>
                    </button>
                    <div class="vr"></div>
                    <div id="helpDropdown" class="dropdown">
                        <button class="btn btn-secondary btn-icon-circle dropdown-toggle" type="button"
                                id="helpDropdownButton" data-bs-toggle="dropdown" aria-haspopup="true"
                                aria-expanded="false" title="Help">
                            <span class="fas fa-question"></span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="helpDropdownButton">
                            <li>
                                <button type="button" class="dropdown-item" id="openApiButton"
                                        data-bs-toggle="modal" data-bs-target="#openApiModal">
                                    <span class="fas fa-file-code me-2"></span>OpenAPI spec
                                </button>
                            </li>
                            <li>
                                <button type="button" class="dropdown-item" id="apiGuideButton">
                                    <span class="fas fa-book me-2"></span>API guide
                                </button>
                            </li>
                            <li>
                                <a class="dropdown-item" id="learnMoreButton" target="_blank" rel="noopener"
                                   href="https://solver.timefold.ai/quickstart-next-steps?utm_source=github&utm_medium=quickstart&utm_campaign=timefold-quickstarts&utm_content=flight-crew-scheduling-java">
                                    <span class="fas fa-arrow-up-right-from-square me-2"></span>Learn More
                                </a>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </nav>
    </div>
</header>
<div id="demo" class="container-fluid">
    <div class="sticky-top d-flex justify-content-center align-items-center" aria-live="polite" aria-atomic="true">
        <div id="notificationPanel" style="position: absolute; top: .5rem;"></div>
    </div>

    <div id="visualization"></div>
</div>
<footer class="bg-black">
    <div class="container">
        <div class="hstack gap-3 p-4">
            <div class="ms-auto"><a class="text-white" href="https://solver.timefold.ai?utm_source=github&utm_medium=quickstart&utm_campaign=timefold-quickstarts&utm_content=flight-crew-scheduling-java">Website</a></div>
            <div class="vr"></div>
            <div><a class="text-white" href="https://docs.timefold.ai/timefold-solver/latest?utm_source=github&utm_medium=quickstart&utm_campaign=timefold-quickstarts&utm_content=flight-crew-scheduling-java">Documentation</a></div>
            <div class="vr"></div>
            <div><a class="text-white" href="https://github.com/TimefoldAI/timefold-quickstarts">Code</a></div>
            <div class="vr"></div>
            <div class="me-auto"><a class="text-white" href="https://github.com/TimefoldAI/timefold-solver/discussions">GitHub Discussions</a></div>
        </div>
    </div>
    <div id="applicationInfo" class="container text-center"></div>
</footer>
<div class="modal fade bd-example-modal-lg" id="scoreAnalysisModal" tabindex="-1"
     aria-labelledby="scoreAnalysisModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="scoreAnalysisModalLabel">Score analysis <span
                        id="scoreAnalysisScoreLabel"></span></h1>

                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body" id="scoreAnalysisModalContent">
                <!-- Filled in by quickstart-page.js's analyze() -->
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="openApiModal" tabindex="-1" aria-labelledby="openApiModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-fullscreen">
        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="openApiModalLabel">OpenAPI spec</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-0">
                <iframe src="/q/swagger-ui" style="width: 100%; height: 100%; border: 0;"></iframe>
            </div>
        </div>
    </div>
</div>

<!-- model-path/demo-data-id attributes are set by QuickstartPage's constructor (quickstart-page.js) -->
<api-guide-modal></api-guide-modal>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/jquery@4.0.0/dist/jquery.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@js-joda/core@6.1.0/dist/js-joda.min.js" integrity="sha256-Uu/3Fv5M3qvr/wX1tKoqAPNE8tiS0vOUm3YdWU1cVAI=" crossorigin="anonymous"></script>
<script src="shared/environment.js"></script>
<script src="shared/solver-client.js"></script>
<script src="shared/quickstart-page.js"></script>
<script src="shared/api-guide.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vis-timeline@7.7.2/standalone/umd/vis-timeline-graph2d.min.js"
        integrity="sha256-Jy2+UO7rZ2Dgik50z3XrrNpnc5+2PAx9MhL2CicodME=" crossorigin="anonymous"></script>
<script src="visualize.js"></script>
</body>
</html>
