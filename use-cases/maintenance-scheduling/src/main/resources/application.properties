########################
# Timefold Solver properties
########################

# The solver runs for 30 seconds. To run for 5 minutes use "PT5M" and for 2 hours use "PT2H".
timefold.model.termination.spent-limit=PT30S

# Temporary comment this out to detect bugs in your code (lowers performance)
# quarkus.timefold.solver.environment-mode=FULL_ASSERT

# Temporary comment this out to return a feasible solution as soon as possible
# quarkus.timefold.solver.termination.best-score-limit=0hard/*soft

# To see what Timefold is doing, turn on DEBUG or TRACE logging.
quarkus.log.category."ai.timefold.solver".level=INFO
# For TRACE logging also activate this:
# quarkus.log.min-level=TRACE
%test.quarkus.log.category."ai.timefold.solver".level=INFO
%prod.quarkus.log.category."ai.timefold.solver".level=INFO

########################
# Model information
########################

timefold.model.id=maintenance-scheduling
quarkus.application.name=${timefold.model.id}
timefold.model.name=Maintenance Scheduling
model.api.version=v1
timefold.model.api-version=${model.api.version}

timefold.model.contact.email=example@acme.com
timefold.model.contact.name=A.C.M.E.
timefold.model.contact.url=https://acme.com
timefold.model.maturity-level=Example

timefold.model.features[0]=Never double-book a crew: one crew works at most one maintenance job at a time.
timefold.model.features[1]=Never start a job before the date from which it is ready to be worked on.
timefold.model.features[2]=Never let a job run past the date on which it is due.
timefold.model.features[3]=Schedule every job on workdays only, skipping weekends when computing its end date.
timefold.model.features[4]=Avoid finishing a job well before its ideal end date, since maintenance done too early has to be repeated sooner.
timefold.model.features[5]=Avoid finishing a job after its ideal end date, since a late job risks running over its due date.
timefold.model.features[6]=Avoid overlapping jobs that share a tag, for example road works in the same area.

########################
# Model settings
########################

timefold.model.max-thread-count=16
timefold.model.default-config.max-thread-count=1

########################
# Native build properties
########################

# Enable Swagger UI also in the native mode
quarkus.swagger-ui.always-include=true

########################
# Test overrides
########################

# Effectively disable spent-time termination in favor of the best-score-limit.
# This model scores with HardSoftScore, so both best-score-limit keys the SDK ships with a
# three-level default (timefold.model.* and quarkus.timefold.solver.*) have to be overridden;
# leaving either at "0hard/0medium/*soft" fails every run with a scoreString pattern error.
%test.timefold.model.termination.spent-limit=PT1H
%test.timefold.model.termination.best-score-limit=0hard/*soft
%test.quarkus.timefold.solver.termination.best-score-limit=0hard/*soft
