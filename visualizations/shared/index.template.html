<!--
  This file is a template, not a page: visualizations/sync.sh renders it into
  each quickstart's index.html, substituting the {{PLACEHOLDER}}s below with
  that quickstart's metadata, configured in sync.sh - there is no per-quickstart
  markup here. <timefold-quickstart-visualization> is the one "slot": the
  quickstart's own visualize.js defines that custom element and builds
  whatever demo-specific markup (tabs, tables, ...) it needs into it.

  Do not hand-edit a generated index.html - edit this template (for shell
  markup shared by every quickstart), sync.sh (for that quickstart's
  metadata/vendor includes) or its visualize.js (for its own markup), then
  re-run sync.sh.

  This comment itself is stripped by sync.sh, so it never ships in a generated
  index.html - it's for whoever is editing this template file, not the page.
-->
<html lang="en">
<head>
    <meta content="text/html; charset=UTF-8" http-equiv="Content-Type">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>{{TITLE}}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="shared/timefold-quickstart.css">
    <link rel="icon" href="https://timefold.ai/uploads/images/Brand-Assets/timefold-solver-logomark.png" type="image/png">
{{HEAD_EXTRA}}
</head>
<body>
<header id="appHeader" class="bg-white shadow">
    <div class="container-fluid">
        <nav class="navbar navbar-expand-lg mb-3">
            <a class="navbar-brand" style="width: 200px;overflow: hidden;">
                <img src="https://timefold.ai/uploads/images/Brand-Assets/timefold-solver-logo.png" alt="Timefold Solver logo" width="200px" style="margin-top:-20px;margin-bottom:-20px">
            </a>
            <a class="navbar-brand d-none d-lg-block">{{NAME}} Quickstart</a>
            <div class="ms-auto">
                <div id="solveControls" class="d-flex align-items-center gap-2">
                    <div class="text-end lh-sm">
                        <div id="score" class="score">Score: ?</div>
                        <div id="info" class="input-metric"></div>
                    </div>
                    <button id="analyzeButton" type="button" class="btn btn-secondary btn-icon-circle" title="Score analysis">
                        <span class="fas fa-magnifying-glass-chart"></span>
                    </button>
                    <div class="vr"></div>
                    <button id="solveButton" type="button" class="btn btn-success">
                        <span class="fas fa-play"></span> Solve
                    </button>
                    <button id="stopSolvingButton" type="button" class="btn btn-danger" style="display: none">
                        <span class="fas fa-stop"></span> Stop solving
                    </button>
                    <div class="vr" id="dataDropdownDivider"></div>
                    <div id="dataDropdown" class="dropdown">
                        <button class="btn btn-secondary dropdown-toggle" type="button" id="dropdownMenuButton"
                                data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                            Data
                        </button>
                        <div id="testDataButton" class="dropdown-menu dropdown-menu-end" aria-labelledby="dropdownMenuButton"></div>
                    </div>
                    <div class="vr"></div>
                    <button id="toggleSummaryButton" type="button" class="btn btn-secondary btn-icon-circle" title="Solution details" style="display: none">
                        <i class="fas fa-chart-bar"></i>
                    </button>
                </div>
            </div>
        </nav>
    </div>
</header>
<div id="demo" class="container-fluid">
    <div class="sticky-top d-flex justify-content-center align-items-center" aria-live="polite" aria-atomic="true">
        <div id="notificationPanel" style="position: absolute; top: .5rem;"></div>
    </div>

    <timefold-quickstart-visualization></timefold-quickstart-visualization>
</div>
<footer class="bg-black">
    <div class="container">
        <div class="hstack gap-3 p-4">
            <div class="ms-auto"><a class="text-white" href="https://solver.timefold.ai?utm_source=github&utm_medium=quickstart&utm_campaign=timefold-quickstarts&utm_content={{UTM_CONTENT}}">Website</a></div>
            <div class="vr"></div>
            <div><a class="text-white" href="https://docs.timefold.ai/timefold-solver/latest?utm_source=github&utm_medium=quickstart&utm_campaign=timefold-quickstarts&utm_content={{UTM_CONTENT}}">Documentation</a></div>
            <div class="vr"></div>
            <div><a class="text-white" href="https://github.com/TimefoldAI/timefold-quickstarts">Code</a></div>
            <div class="vr"></div>
            <div class="me-auto"><a class="text-white" href="https://github.com/TimefoldAI/timefold-solver/discussions">GitHub Discussions</a></div>
        </div>
    </div>
    <div id="applicationInfo" class="container text-center"></div>
</footer>
<div class="modal fadebd-example-modal-lg" id="scoreAnalysisModal" tabindex="-1"
     aria-labelledby="scoreAnalysisModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="scoreAnalysisModalLabel">Score analysis <span
                        id="scoreAnalysisScoreLabel"></span></h1>

                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body" id="scoreAnalysisModalContent">
                <!-- Filled in by quickstart-page.js's analyze() -->
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/jquery@4.0.0/dist/jquery.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@js-joda/core@6.1.0/dist/js-joda.min.js" integrity="sha256-Uu/3Fv5M3qvr/wX1tKoqAPNE8tiS0vOUm3YdWU1cVAI=" crossorigin="anonymous"></script>
<script src="shared/environment.js"></script>
<script src="shared/solver-client.js"></script>
<script src="shared/quickstart-page.js"></script>
{{SCRIPTS_EXTRA}}
<script src="visualize.js"></script>
</body>
</html>
